    # Xenoclient: include inside the instance's HTTPS `server { ... }` block,
    # BEFORE `location / {`. Adjust the alias path to where `app/` lives on the host.

    # The service worker must always be revalidated so updates reach the phone.
    location = /app/sw.js {
        alias /var/www/xenoclient/app/sw.js;
        add_header Cache-Control "no-cache";
        # The app's own policy (not xenomorph's): scripts and styles only from /app/ itself, API
        # calls only to this origin, pictures and media from the web (https), nothing framed.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; media-src https:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff;
    }

    location /app/ {
        alias /var/www/xenoclient/app/;
        index index.html;
        types { application/manifest+json webmanifest; }
        include /etc/nginx/mime.types;

        # Do NOT copy xenomorph's own policy here (`default-src 'none'; script-src 'none'`):
        # it would block the app's scripts. The policy below is the app's own.
        # Always revalidate: without this the browser keeps old scripts for hours.
        add_header Cache-Control "no-cache";
        # The app's own policy (not xenomorph's): scripts and styles only from /app/ itself, API
        # calls only to this origin, pictures and media from the web (https), nothing framed.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; media-src https:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }

