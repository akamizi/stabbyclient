# Include inside the existing `server { ... }` block of the instance's domain.
# Replace /srv/xenoclient/app/ with where the `app/` folder is mounted in the
# nginx container (see deploy/README.md).
location /app/ {
    alias /srv/xenoclient/app/;
    index index.html;
    try_files $uri $uri/ /app/index.html;

    # The service worker must always be revalidated so updates reach the phone.
    location = /app/sw.js {
        alias /srv/xenoclient/app/sw.js;
        add_header Cache-Control "no-cache";
    }

    # Do NOT add a global Content-Security-Policy here: xenomorph sets
    # `default-src 'none'; script-src 'none'` on its own pages, and a copy of it on
    # /app/ would block the app's scripts. Serve /app/ straight from disk, as here.
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
